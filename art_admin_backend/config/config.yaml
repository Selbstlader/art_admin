server:
  port: 48080
  mode: debug # debug, release, test

database:
  driver: mysql
  host: 127.0.0.1
  port: 3306
  database: gin_admin
  username: root
  password: 123456
  charset: utf8mb4
  parseTime: true
  maxIdleConns: 10
  maxOpenConns: 100
  connMaxLifetime: 3600 # 秒

jwt:
  secret: art-admin-secret-key-change-in-production-32bytes
  accessTokenExpire: 7200 # 2小时，单位秒
  refreshTokenExpire: 604800 # 7天，单位秒
  issuer: art-admin

log:
  level: info # debug, info, warn, error
  filename: logs/app.log
  maxSize: 100 # MB
  maxAge: 30 # days
  maxBackups: 5
  compress: true

cors:
  allowOrigins:
    - http://localhost:5173
    - http://localhost:3000
  allowMethods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
  allowHeaders:
    - Authorization
    - Content-Type
  exposeHeaders:
    - Content-Length
  allowCredentials: true
  maxAge: 43200 # 12小时

swagger:
  title: Art Admin API
  version: 1.0.0
  description: Art Admin Backend API Documentation
  host: localhost:48080
  basePath: /

dify:
  datasetApiKey: dataset-QQ8Y3Cxvss4RvQXvU7Gem4sb # 知识库 API Key
  chatApiKey: app-D7hSHUnPoMt5CQD2IEoBsPJz # AI对话 API Key (不使用)
  baseUrl: https://api.dify.ai/v1 # Dify API Base URL
  timeout: 60 # 请求超时时间(秒)
  datasetId: 7e2a67c6-00ab-46d0-a71b-886bb480d18f # 知识库 Dataset ID (用于学习系统)

deepseek:
  apiKey: sk-a8e4ee88516f40e6a2dc3776d3254846 # DeepSeek API Key
  baseUrl: https://api.deepseek.com # DeepSeek API Base URL
  model: deepseek-chat # 模型名称
  timeout: 120 # 请求超时时间(秒)
  maxTokens: 4096 # 最大生成 token 数
  temperature: 0.7 # 温度参数 0-2

