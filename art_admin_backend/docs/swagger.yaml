host: localhost:48080
info:
  contact: {}
  description: Art Admin Backend API Documentation
  title: Art Admin API
  version: "1.0"
paths:
  /api/app-user/create:
    post:
      consumes:
      - application/json
      description: 创建新APP用户
      parameters:
      - description: 用户信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.CreateAppUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 创建成功
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 创建APP用户
      tags:
      - APP用户管理
  /api/app-user/delete/{id}:
    delete:
      consumes:
      - application/json
      description: 删除APP用户
      parameters:
      - description: 用户ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 删除成功
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 删除APP用户
      tags:
      - APP用户管理
  /api/app-user/list:
    get:
      consumes:
      - application/json
      description: 分页查询APP用户列表
      parameters:
      - description: 当前页码
        in: query
        minimum: 1
        name: current
        required: true
        type: integer
      - description: 每页条数
        in: query
        maximum: 100
        minimum: 1
        name: size
        required: true
        type: integer
      - description: 用户ID
        in: query
        name: id
        type: integer
      - description: 用户账号
        in: query
        name: userName
        type: string
      - description: 用户昵称
        in: query
        name: nickName
        type: string
      - description: 手机号
        in: query
        name: phone
        type: string
      - description: 用户类型
        in: query
        name: userType
        type: string
      - description: 状态
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 查询成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/response.PaginatedData'
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 获取APP用户列表
      tags:
      - APP用户管理
  /api/app-user/reset-password:
    post:
      consumes:
      - application/json
      description: 重置APP用户密码
      parameters:
      - description: 重置密码信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.ResetAppUserPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 重置成功
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 重置APP用户密码
      tags:
      - APP用户管理
  /api/app-user/update:
    put:
      consumes:
      - application/json
      description: 更新APP用户信息
      parameters:
      - description: 用户信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.UpdateAppUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 更新成功
          schema:
