basePath: /
definitions:
  dto.GenerateMaterialRequest:
    properties:
      difficulty:
        maximum: 3
        minimum: 1
        type: integer
      grade:
        type: string
      subject_id:
        type: integer
      topic:
        type: string
    required:
    - difficulty
    - grade
    - subject_id
    - topic
    type: object
  dto.GradeInfo:
    properties:
      count:
        type: integer
      grade:
        type: string
    type: object
  dto.GradeListResponse:
    properties:
      grades:
        items:
          $ref: '#/definitions/dto.GradeInfo'
        type: array
      subject_id:
        type: integer
    type: object
  dto.MaterialListResponse:
    properties:
      limit:
        type: integer
      list:
        items:
          $ref: '#/definitions/dto.MaterialResponse'
        type: array
      page:
        type: integer
      total:
        type: integer
    type: object
  dto.MaterialResponse:
    properties:
      audio_duration:
        type: integer
      audio_url:
        type: string
      content:
        $ref: '#/definitions/model.MaterialContent'
      created_at:
        type: string
      difficulty:
        type: integer
      favorite_count:
        type: integer
      grade:
        type: string
      id:
        type: integer
      subject_id:
        type: integer
      summary:
        type: string
      title:
        type: string
      topic:
        type: string
      total_time:
        type: integer
      updated_at:
        type: string
      user_id:
        type: integer
      view_count:
        type: integer
    type: object
  dto.SubjectResponse:
    properties:
      description:
        type: string
      grade_levels:
        items:
          type: string
        type: array
      icon:
        type: string
      id:
        type: integer
      name:
        type: string
      sort:
        type: integer
    type: object
  dto.TaskResponse:
    properties:
      created_at:
        type: string
      difficulty:
        type: integer
      error_msg:
        type: string
      grade:
        type: string
      id:
        type: integer
      material_id:
        type: integer
      status:
        type: integer
      subject_id:
        type: integer
      topic:
        type: string
      updated_at:
        type: string
      user_id:
        type: integer
    type: object
  model.Exercise:
    properties:
      answer:
        type: string
      explanation:
        type: string
      id:
        type: integer
      options:
        items:
          type: string
        type: array
      question:
        type: string
      type:
        description: choice, fill, calculate, essay
        type: string
    type: object
  model.MaterialContent:
    properties:
      sections:
        items:
          $ref: '#/definitions/model.MaterialSection'
        type: array
      summary:
        type: string
      title:
        type: string
      total_time:
        type: integer
    type: object
  model.MaterialSection:
    properties:
      answer:
        type: string
      content:
        type: string
      difficulty:
        type: string
      key_points:
        items:
          type: string
        type: array
      question:
        type: string
      questions:
        items:
          $ref: '#/definitions/model.Exercise'
        type: array
      solution:
        type: string
      title:
        type: string
      type:
        description: knowledge, example, exercise
        type: string
    type: object
  request.CreateAppUserRequest:
    properties:
      avatar:
        type: string
      email:
        type: string
      nickName:
        maxLength: 50
        type: string
      password:
        minLength: 6
        type: string
      phone:
        type: string
      status:
        enum:
        - "1"
        - "2"
        type: string
      userName:
        maxLength: 50
        minLength: 3
        type: string
      userType:
        enum:
        - "1"
        - "2"
        type: string
    required:
    - nickName
    - password
    - phone
    - status
    - userName
    - userType
    type: object
  request.CreateDepartmentRequest:
    properties:
      deptCode:
        maxLength: 50
        type: string
      deptName:
        maxLength: 50
        type: string
      email:
        maxLength: 50
        type: string
      leader:
        maxLength: 20
        type: string
      orderNum:
        maximum: 999
        minimum: 0
        type: integer
      parentId:
        example: 1
        type: integer
      phone:
        maxLength: 11
        type: string
      status:
        enum:
        - 0
        - 1
        type: integer
    required:
    - deptCode
    - deptName
    type: object
  request.CreateDictionaryRequest:
    properties:
      enabled:
        type: boolean
      label:
        maxLength: 100
        type: string
      orderNum:
        type: integer
      remark:
        maxLength: 500
        type: string
      typeCode:
        maxLength: 50
        type: string
      value:
        maxLength: 100
        type: string
    required:
    - label
    - typeCode
    - value
    type: object
  request.CreateDictionaryTypeRequest:
    properties:
      description:
        maxLength: 200
        type: string
      enabled:
        type: boolean
      remark:
        maxLength: 500
        type: string
      typeCode:
        maxLength: 50
        type: string
      typeName:
        maxLength: 50
        type: string
    required:
    - typeCode
    - typeName
    type: object
  request.CreateMenuRequest:
    properties:
      activePath:
        description: 激活路径
        maxLength: 200
        type: string
      component:
        description: 组件路径
        maxLength: 200
        type: string
      fixedTab:
        description: 固定标签
        type: boolean
      icon:
        description: 图标
        maxLength: 50
        type: string
      isEnable:
        description: 是否启用
        type: boolean
      isFullPage:
        description: 全屏页面
        type: boolean
      isHide:
        description: 隐藏菜单
        type: boolean
      isHideTab:
        description: 隐藏标签
        type: boolean
      isIframe:
        description: 是否内嵌
        type: boolean
      isMenu:
        description: 是否菜单
        type: boolean
      keepAlive:
        description: 页面缓存
        type: boolean
      label:
        description: 路由名称/权限标识（前端form.label）
        maxLength: 100
        type: string
      link:
        description: 外部链接
        maxLength: 500
        type: string
      name:
        description: 菜单显示名称（前端form.name）
        maxLength: 50
        type: string
      parentId:
        type: integer
      path:
        description: 路由地址
        maxLength: 200
        type: string
      redirect:
        description: 重定向路径
        maxLength: 200
        type: string
      roles:
        description: 角色权限（前端用）
        items:
          type: string
        type: array
      showBadge:
        description: 显示徽章
        type: boolean
      showTextBadge:
        description: 文本徽章
        maxLength: 50
        type: string
      sort:
        description: 排序
        type: integer
    required:
    - label
    - name
    - path
    type: object
  request.CreateRoleRequest:
    properties:
      buttonIds:
        items:
          type: integer
        type: array
      description:
        maxLength: 200
        type: string
      enabled:
        type: boolean
      menuIds:
        items:
          type: integer
        type: array
      roleCode:
        maxLength: 50
        type: string
      roleName:
        maxLength: 50
        type: string
    required:
    - roleCode
    - roleName
    type: object
  request.CreateUserRequest:
    properties:
      avatar:
        type: string
      email:
        type: string
      nickName:
        maxLength: 50
        type: string
      password:
        minLength: 6
        type: string
      roleIds:
        items:
          type: integer
        minItems: 1
        type: array
      status:
        enum:
        - "0"
        - "1"
        type: string
      userGender:
        enum:
        - male
        - female
        - unknown
        type: string
      userName:
        maxLength: 50
        minLength: 3
        type: string
      userPhone:
        type: string
    required:
    - email
    - nickName
    - password
    - roleIds
    - status
    - userGender
    - userName
    - userPhone
    type: object
  request.DeleteDictionaryRequest:
    properties:
      id:
        type: integer
    required:
    - id
    type: object
  request.DeleteDictionaryTypeRequest:
    properties:
      id:
        type: integer
    required:
    - id
    type: object
  request.DifyChatRequest:
    properties:
      auto_generate_name:
        description: 是否自动生成标题
        type: boolean
      conversation_id:
        description: 会话ID
        type: string
      files:
        description: 文件列表
        items:
          $ref: '#/definitions/request.DifyFileInfo'
        type: array
      inputs:
        additionalProperties: true
        description: 输入变量
        type: object
      query:
        description: 用户问题
        type: string
      response_mode:
        description: '响应模式: blocking/streaming (内部设置)'
        type: string
      user:
        description: 用户标识
        type: string
    required:
    - query
    - user
    type: object
  request.DifyFileInfo:
    properties:
      transfer_method:
        description: '传输方式: remote_url/local_file'
        type: string
      type:
        description: '文件类型: image/document'
        type: string
      upload_file_id:
        description: 上传文件ID
        type: string
      url:
        description: 远程URL
        type: string
    type: object
  request.LoginRequest:
    properties:
      password:
        example: "123456"
        type: string
      userName:
        example: admin
        type: string
    required:
    - password
    - userName
    type: object
  request.ResetAppUserPasswordRequest:
    properties:
      id:
        type: integer
      newPassword:
        minLength: 6
        type: string
    required:
    - id
    - newPassword
    type: object
  request.ResetPasswordRequest:
