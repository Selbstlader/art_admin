basePath: /
definitions:
  request.CreateDictionaryRequest:
    properties:
      enabled:
        type: boolean
      label:
        maxLength: 100
        type: string
      orderNum:
        type: integer
      remark:
        maxLength: 500
        type: string
      typeCode:
        maxLength: 50
        type: string
      value:
        maxLength: 100
        type: string
    required:
    - label
    - typeCode
    - value
    type: object
  request.CreateDictionaryTypeRequest:
    properties:
      description:
        maxLength: 200
        type: string
      enabled:
        type: boolean
      remark:
        maxLength: 500
        type: string
      typeCode:
        maxLength: 50
        type: string
      typeName:
        maxLength: 50
        type: string
    required:
    - typeCode
    - typeName
    type: object
  request.CreateMenuRequest:
    properties:
      activePath:
        description: 激活路径
        maxLength: 200
        type: string
      component:
        description: 组件路径
        maxLength: 200
        type: string
      fixedTab:
        description: 固定标签
        type: boolean
      icon:
        description: 图标
        maxLength: 50
        type: string
      isEnable:
        description: 是否启用
        type: boolean
      isFullPage:
        description: 全屏页面
        type: boolean
      isHide:
        description: 隐藏菜单
        type: boolean
      isHideTab:
        description: 隐藏标签
        type: boolean
      isIframe:
        description: 是否内嵌
        type: boolean
      isMenu:
        description: 是否菜单
        type: boolean
      keepAlive:
        description: 页面缓存
        type: boolean
      label:
        description: 路由名称/权限标识（前端form.label）
        maxLength: 100
        type: string
      link:
        description: 外部链接
        maxLength: 500
        type: string
      name:
        description: 菜单显示名称（前端form.name）
        maxLength: 50
        type: string
      parentId:
        type: integer
      path:
        description: 路由地址
        maxLength: 200
        type: string
      redirect:
        description: 重定向路径
        maxLength: 200
        type: string
      roles:
        description: 角色权限（前端用）
        items:
          type: string
        type: array
      showBadge:
        description: 显示徽章
        type: boolean
      showTextBadge:
        description: 文本徽章
        maxLength: 50
        type: string
      sort:
        description: 排序
        type: integer
    required:
    - label
    - name
    - path
    type: object
  request.CreateRoleRequest:
    properties:
      buttonIds:
        items:
          type: integer
        type: array
      description:
        maxLength: 200
        type: string
      enabled:
        type: boolean
      menuIds:
        items:
          type: integer
        type: array
      roleCode:
        maxLength: 50
        type: string
      roleName:
        maxLength: 50
        type: string
    required:
    - roleCode
    - roleName
    type: object
  request.CreateUserRequest:
    properties:
      avatar:
        type: string
      email:
        type: string
      nickName:
        maxLength: 50
        type: string
      password:
        minLength: 6
        type: string
      roleIds:
        items:
          type: integer
        minItems: 1
        type: array
      status:
        enum:
        - "0"
        - "1"
        type: string
      userGender:
        enum:
        - male
        - female
        - unknown
        type: string
      userName:
        maxLength: 50
        minLength: 3
        type: string
      userPhone:
        type: string
    required:
    - email
    - nickName
    - password
    - roleIds
    - status
    - userGender
    - userName
    - userPhone
    type: object
  request.DeleteDictionaryRequest:
    properties:
      id:
        type: integer
    required:
    - id
    type: object
  request.DeleteDictionaryTypeRequest:
    properties:
      id:
        type: integer
    required:
    - id
    type: object
  request.LoginRequest:
    properties:
      password:
        example: "123456"
        type: string
      userName:
        example: admin
        type: string
    required:
    - password
    - userName
    type: object
  request.ResetPasswordRequest:
    properties:
      id:
        type: integer
      newPassword:
        minLength: 6
        type: string
    required:
    - id
    - newPassword
    type: object
  request.UpdateDictionaryRequest:
    properties:
      enabled:
        type: boolean
      id:
        type: integer
      label:
        maxLength: 100
        type: string
      orderNum:
        type: integer
      remark:
        maxLength: 500
        type: string
      typeCode:
        maxLength: 50
        type: string
      value:
        maxLength: 100
        type: string
    required:
    - id
    - label
    - typeCode
    - value
    type: object
  request.UpdateDictionaryTypeRequest:
    properties:
      description:
        maxLength: 200
        type: string
      enabled:
        type: boolean
      id:
        type: integer
      remark:
        maxLength: 500
        type: string
      typeCode:
        maxLength: 50
        type: string
      typeName:
        maxLength: 50
        type: string
    required:
    - id
    - typeCode
    - typeName
    type: object
  request.UpdateMenuRequest:
    properties:
      activePath:
        maxLength: 200
        type: string
      component:
        maxLength: 200
        type: string
      fixedTab:
        type: boolean
      icon:
        maxLength: 50
        type: string
      id:
        type: integer
      isEnable:
        type: boolean
      isFullPage:
        type: boolean
      isHide:
        type: boolean
      isHideTab:
        type: boolean
      isIframe:
        type: boolean
      isMenu:
        type: boolean
      keepAlive:
        type: boolean
      label:
        maxLength: 100
        type: string
      link:
        maxLength: 500
        type: string
      name:
        maxLength: 50
        type: string
      parentId:
        type: integer
      path:
        maxLength: 200
        type: string
      redirect:
        maxLength: 200
        type: string
      roles:
        items:
          type: string
        type: array
      showBadge:
        type: boolean
      showTextBadge:
        maxLength: 50
        type: string
      sort:
        type: integer
    required:
    - id
    - label
    - name
    - path
    type: object
  request.UpdateRolePermissionsRequest:
    properties:
      buttonIds:
        items:
          type: integer
        type: array
      menuIds:
        items:
          type: integer
        type: array
    required:
    - buttonIds
    - menuIds
    type: object
  request.UpdateRoleRequest:
    properties:
      buttonIds:
        items:
          type: integer
        type: array
      description:
        maxLength: 200
        type: string
      enabled:
        type: boolean
      menuIds:
        items:
          type: integer
        type: array
      roleCode:
        maxLength: 50
        type: string
      roleId:
        type: integer
      roleName:
        maxLength: 50
        type: string
    required:
    - roleCode
    - roleId
    - roleName
    type: object
  request.UpdateUserRequest:
    properties:
      avatar:
        type: string
      email:
        type: string
      id:
        type: integer
      nickName:
        maxLength: 50
        type: string
      roleIds:
        items:
          type: integer
        minItems: 1
        type: array
      status:
        enum:
        - "0"
        - "1"
        type: string
      userGender:
        enum:
        - male
        - female
        - unknown
        type: string
      userPhone:
        type: string
    required:
    - email
    - id
    - nickName
    - roleIds
    - status
    - userGender
    - userPhone
    type: object
  response.AuthButton:
    properties:
      authMark:
        type: string
      title:
        type: string
    type: object
  response.DictionaryResponse:
    properties:
      createBy:
        type: string
      createTime:
        type: string
      enabled:
        type: boolean
      id:
        type: integer
      label:
        type: string
      orderNum:
        type: integer
      remark:
        type: string
      typeCode:
        type: string
      updateBy:
        type: string
      updateTime:
        type: string
      value:
        type: string
    type: object
  response.DictionaryTypeResponse:
    properties:
      createBy:
        type: string
      createTime:
        type: string
      description:
        type: string
      enabled:
        type: boolean
      id:
        type: integer
      remark:
        type: string
      typeCode:
        type: string
      typeName:
        type: string
      updateBy:
        type: string
      updateTime:
        type: string
    type: object
  response.LoginResponse:
    properties:
      refreshToken:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
    type: object
  response.MenuMeta:
    properties:
      authList:
        items:
          $ref: '#/definitions/response.AuthButton'
        type: array
      fixedTab:
        type: boolean
      icon:
        type: string
      isFullPage:
        type: boolean
      isHide:
        type: boolean
      isHideTab:
        type: boolean
      keepAlive:
        type: boolean
      title:
        type: string
    type: object
  response.MenuResponse:
    properties:
      children:
        items:
          $ref: '#/definitions/response.MenuResponse'
        type: array
      component:
        type: string
      id:
        type: integer
      meta:
        $ref: '#/definitions/response.MenuMeta'
      name:
        type: string
      parentId:
        description: 父菜单ID
        type: integer
      path:
        type: string
      redirect:
        type: string
    type: object
  response.PaginatedData:
    properties:
      current:
        description: 当前页码
        type: integer
      records:
        description: 记录列表
      size:
        description: 每页条数
        type: integer
      total:
        description: 总记录数
        type: integer
    type: object
  response.Response:
    properties:
      code:
        description: 状态码
        type: integer
      data:
        description: 数据
      msg:
        description: 消息
        type: string
    type: object
  response.UserInfoResponse:
    properties:
      avatar:
        example: https://...
        type: string
      buttons:
        example:
        - user:add
        - user:edit
        items:
          type: string
        type: array
      email:
        example: admin@example.com
        type: string
      roles:
        example:
        - admin
        - user
        items:
          type: string
        type: array
      userId:
        example: 1
        type: integer
      userName:
        example: admin
        type: string
    type: object
host: localhost:48080
info:
  contact: {}
  description: Art Admin Backend API Documentation
  title: Art Admin API
  version: "1.0"
paths:
  /api/auth/login:
    post:
      consumes:
      - application/json
      description: 用户登录接口
      parameters:
      - description: 登录参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 登录成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/response.LoginResponse'
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/response.Response'
      summary: 用户登录
      tags:
      - 认证管理
  /api/dictionary:
    delete:
      consumes:
      - application/json
      description: 删除字典数据
      parameters:
      - description: 字典数据ID
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/request.DeleteDictionaryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 删除成功
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: 字典数据不存在
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 删除失败
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 删除字典数据
      tags:
      - 字典管理
    post:
      consumes:
      - application/json
      description: 创建新的字典数据
      parameters:
      - description: 字典数据信息
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/request.CreateDictionaryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 创建成功
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 创建失败
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 创建字典数据
      tags:
      - 字典管理
    put:
      consumes:
      - application/json
      description: 更新字典数据信息
      parameters:
      - description: 字典数据信息
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/request.UpdateDictionaryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 更新成功
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: 字典数据不存在
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 更新失败
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 更新字典数据
      tags:
      - 字典管理
  /api/dictionary/{id}:
    get:
      consumes:
      - application/json
      description: 根据ID获取字典数据详情
      parameters:
      - description: 字典数据ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 查询成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/response.DictionaryResponse'
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: 字典数据不存在
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 根据ID获取字典数据
      tags:
      - 字典管理
  /api/dictionary/by-type:
    get:
      consumes:
      - application/json
      description: 根据类型编码获取字典数据列表（用于下拉框等）
      parameters:
      - description: 字典类型编码
        in: query
        name: typeCode
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 查询成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/response.DictionaryResponse'
                  type: array
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 根据类型编码获取字典数据
      tags:
      - 字典管理
  /api/dictionary/list:
    get:
      consumes:
      - application/json
      description: 分页查询字典数据列表
      parameters:
      - description: 当前页码
        in: query
        minimum: 1
        name: current
        required: true
        type: integer
      - description: 每页条数
        in: query
        maximum: 100
        minimum: 1
        name: size
        required: true
        type: integer
      - description: 字典数据ID
        in: query
        name: id
        type: integer
      - description: 字典类型编码
        in: query
        name: typeCode
        type: string
      - description: 字典标签
        in: query
        name: label
        type: string
      - description: 字典值
        in: query
        name: value
        type: string
      - description: 是否启用
        in: query
        name: enabled
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: 查询成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/response.PaginatedData'
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 获取字典数据列表
      tags:
      - 字典管理
  /api/dictionary/type:
    delete:
      consumes:
      - application/json
      description: 删除字典类型
      parameters:
      - description: 字典类型ID
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/request.DeleteDictionaryTypeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 删除成功
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: 字典类型不存在
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 删除失败
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 删除字典类型
      tags:
      - 字典管理
    post:
      consumes:
      - application/json
      description: 创建新的字典类型
      parameters:
      - description: 字典类型信息
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/request.CreateDictionaryTypeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 创建成功
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 创建失败
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 创建字典类型
      tags:
      - 字典管理
    put:
      consumes:
      - application/json
      description: 更新字典类型信息
      parameters:
      - description: 字典类型信息
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/request.UpdateDictionaryTypeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 更新成功
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: 字典类型不存在
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 更新失败
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 更新字典类型
      tags:
      - 字典管理
  /api/dictionary/type/{id}:
    get:
      consumes:
      - application/json
      description: 根据ID获取字典类型详情
      parameters:
      - description: 字典类型ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 查询成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/response.DictionaryTypeResponse'
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: 字典类型不存在
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 根据ID获取字典类型
      tags:
      - 字典管理
  /api/dictionary/type/list:
    get:
      consumes:
      - application/json
      description: 分页查询字典类型列表
      parameters:
      - description: 当前页码
        in: query
        minimum: 1
        name: current
        required: true
        type: integer
      - description: 每页条数
        in: query
        maximum: 100
        minimum: 1
        name: size
        required: true
        type: integer
      - description: 字典类型ID
        in: query
        name: id
        type: integer
      - description: 字典类型名称
        in: query
        name: typeName
        type: string
      - description: 字典类型编码
        in: query
        name: typeCode
        type: string
      - description: 描述
        in: query
        name: description
        type: string
      - description: 是否启用
        in: query
        name: enabled
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: 查询成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/response.PaginatedData'
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 获取字典类型列表
      tags:
      - 字典管理
  /api/menu/all:
    get:
