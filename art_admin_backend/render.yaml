# Render Blueprint 配置
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: art-admin-backend
    runtime: go
    rootDir: art_admin_backend
    buildCommand: go build -o server ./cmd/server
    startCommand: ./server
    healthCheckPath: /health
    envVars:
      - key: GIN_MODE
        value: release
      - key: DB_DRIVER
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: art-admin-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: BASE_URL
        fromService:
          type: web
          name: art-admin-backend
          property: host

databases:
  - name: art-admin-db
    plan: free
    databaseName: art_admin
